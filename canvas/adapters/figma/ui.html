<style>
  body { font: 12px Inter, system-ui, sans-serif; margin: 12px; color: #222; }
  h1 { font-size: 13px; margin: 0 0 8px; }
  label { display: block; margin: 4px 0; }
  .row { display: flex; gap: 6px; margin: 10px 0; }
  button { flex: 1; padding: 8px; border: 0; border-radius: 6px; background: #18a0fb; color: #fff; font-weight: 600; cursor: pointer; }
  button.secondary { background: #e5e5e5; color: #222; }
  #out { white-space: pre-wrap; background: #f5f5f5; border-radius: 6px; padding: 8px; height: 300px; overflow: auto; font: 11px ui-monospace, monospace; }
  .error { color: #c00; } .warning { color: #a60; } .info { color: #555; }
</style>
<h1>DwoCanvas Export</h1>
<p>Select top-level frames (screens). Components used by instances are exported with them. Output: <code>dwocanvas/2</code> JSON (check it with <code>python -m dwocanvas validate</code>).</p>
<label><input type="checkbox" id="autoBake" checked> Auto-bake what UMG cannot draw (vectors, blend modes, masks, layer blur)</label>
<label><input type="checkbox" id="previews" checked> Include frame previews (visual diff in UE)</label>
<label>Bake scale <select id="bakeScale"><option value="1">1x</option><option value="2" selected>2x</option><option value="3">3x</option></select></label>
<div class="row">
  <button class="secondary" id="lint">Lint</button>
  <button class="secondary" id="audit">Audit</button>
  <button id="export">Export JSON</button>
</div>
<div id="out">Ready.</div>
<script>
  const out = document.getElementById("out");
  const options = () => ({
    autoBake: document.getElementById("autoBake").checked,
    previews: document.getElementById("previews").checked,
    bakeScale: Number(document.getElementById("bakeScale").value),
  });
  for (const type of ["lint", "audit", "export"]) {
    document.getElementById(type).onclick = () => {
      out.textContent = "Working...";
      parent.postMessage({ pluginMessage: { type, options: options() } }, "*");
    };
  }

  function showLint(items) {
    if (!items.length) return "No lint findings.\n";
    return items.map((i) => `<span class="${i.level}">${i.level.toUpperCase()} ${escape(i.name)}: ${escape(i.message)}</span>`).join("\n") + "\n";
  }
  /** assets[*].sha256 of the decoded image bytes (WebCrypto; skipped when the iframe has no crypto.subtle). */
  async function addAssetHashes(json) {
    try {
      if (!(window.crypto && window.crypto.subtle)) return json;
      const doc = JSON.parse(json);
      const assets = doc.assets || {};
      for (const id of Object.keys(assets)) {
        const asset = assets[id];
        if (!asset || !asset.data) continue;
        const binary = atob(asset.data);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        const digest = new Uint8Array(await window.crypto.subtle.digest("SHA-256", bytes));
        asset.sha256 = Array.from(digest, (b) => b.toString(16).padStart(2, "0")).join("");
      }
      return JSON.stringify(doc);
    } catch (e) {
      return json;
    }
  }

  function escape(s) {
    return String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  onmessage = async (event) => {
    const msg = event.data.pluginMessage;
    if (!msg) return;
    if (msg.type === "error") {
      out.innerHTML = `<span class="error">${escape(msg.message)}</span>`;
    } else if (msg.type === "lint") {
      out.innerHTML = showLint(msg.lint);
    } else if (msg.type === "audit") {
      const rows = Object.entries(msg.usage).sort((a, b) => b[1] - a[1]);
      out.textContent = "Feature usage (most used first):\n" + rows.map(([k, v]) => `${String(v).padStart(5)}  ${k}`).join("\n");
    } else if (msg.type === "export") {
      out.textContent = "Hashing assets...";
      const json = await addAssetHashes(msg.json);
      const blob = new Blob([json], { type: "application/json" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = msg.fileName;
      link.textContent = "Download " + msg.fileName;
      out.innerHTML = "";
      out.appendChild(link);
      out.insertAdjacentHTML("beforeend", "\n\n" + showLint(msg.lint));
      link.click();
    }
  };
</script>
