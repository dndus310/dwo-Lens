; DwoCanvas plugin config. [CoreRedirects] let assets saved by the older DesignBridge plugin load after the rename.

[CoreRedirects]
+PackageRedirects=(OldName="/Script/DesignBridgeRuntime",NewName="/Script/DwoCanvasRuntime")
+PackageRedirects=(OldName="/Script/DesignBridgeEditor",NewName="/Script/DwoCanvasEditor")
+ClassRedirects=(OldName="/Script/DesignBridgeRuntime.DesignShape",NewName="/Script/DwoCanvasRuntime.DwoCanvasShape")
+ClassRedirects=(OldName="/Script/DesignBridgeRuntime.DesignFrame",NewName="/Script/DwoCanvasRuntime.DwoCanvasFrame")
+ClassRedirects=(OldName="/Script/DesignBridgeRuntime.DesignFrameSlot",NewName="/Script/DwoCanvasRuntime.DwoCanvasFrameSlot")
+StructRedirects=(OldName="/Script/DesignBridgeRuntime.DesignShapeStyle",NewName="/Script/DwoCanvasRuntime.DwoCanvasShapeStyle")
+StructRedirects=(OldName="/Script/DesignBridgeRuntime.DesignGradientStop",NewName="/Script/DwoCanvasRuntime.DwoCanvasGradientStop")
+StructRedirects=(OldName="/Script/DesignBridgeRuntime.DesignShadow",NewName="/Script/DwoCanvasRuntime.DwoCanvasShadow")
+EnumRedirects=(OldName="/Script/DesignBridgeRuntime.EDesignFillType",NewName="/Script/DwoCanvasRuntime.EDwoCanvasFillType")
+EnumRedirects=(OldName="/Script/DesignBridgeRuntime.EDesignStrokeAlign",NewName="/Script/DwoCanvasRuntime.EDwoCanvasStrokeAlign")
+EnumRedirects=(OldName="/Script/DesignBridgeRuntime.EDesignFrameDirection",NewName="/Script/DwoCanvasRuntime.EDwoCanvasFrameDirection")
+EnumRedirects=(OldName="/Script/DesignBridgeRuntime.EDesignMainAlign",NewName="/Script/DwoCanvasRuntime.EDwoCanvasMainAlign")
+PackageRedirects=(OldName="/DesignBridge/Materials/M_DesignShape",NewName="/DwoCanvas/Materials/M_DwoCanvasShape")
+ObjectRedirects=(OldName="/DesignBridge/Materials/M_DesignShape.M_DesignShape",NewName="/DwoCanvas/Materials/M_DwoCanvasShape.M_DwoCanvasShape")
