<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="dwocanvas:viewport" content="400x300">
<meta name="dwocanvas:name" content="HtmlAbsolute">
<title>Absolute positioning: canvas boxes, overlay in a flex row, rotation</title>
<style>
@font-face { font-family: "Roboto"; font-weight: 400; font-style: normal; src: url("file:///C:/Program%20Files/Epic%20Games/UE_5.7/Engine/Content/Slate/Fonts/Roboto-Regular.ttf"); }
@font-face { font-family: "Roboto"; font-weight: 700; font-style: normal; src: url("file:///C:/Program%20Files/Epic%20Games/UE_5.7/Engine/Content/Slate/Fonts/Roboto-Bold.ttf"); }

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { background: #222833; font-family: "Roboto"; color: #f2f3f5; font-size: 12px; line-height: 14px; }

/* A plain (non-flex) panel: children are placed by their boxes */
#stage { position: absolute; left: 16px; top: 16px; width: 200px; height: 268px; background: #2e3646; border-radius: 8px; }
.pin { position: absolute; width: 36px; height: 36px; border-radius: 6px; }
#tl { left: 8px; top: 8px; background: #5ac4ff; }
#tr { right: 8px; top: 8px; background: #ffb44a; }
#bl { left: 8px; bottom: 8px; background: #8be08a; }
#br { right: 8px; bottom: 8px; background: #ff6b81; }
#mid { left: 60px; top: 104px; width: 80px; height: 60px; background: #c38cff; border-radius: 10px; }
#tilt { left: 70px; top: 190px; width: 60px; height: 24px; background: #f5f5f7; transform: rotate(15deg); border-radius: 3px; }
#stage-label { position: absolute; left: 60px; top: 60px; font-weight: 700; }

/* A flex column with an absolutely positioned badge floating over it */
#card { position: absolute; left: 232px; top: 16px; width: 152px; height: 172px; display: flex; flex-direction: column; gap: 8px;
        padding: 12px; background: #2e3646; border-radius: 8px; }
.line { height: 24px; border-radius: 4px; background: #46526a; flex: none; }
#badge { position: absolute; right: -6px; top: -6px; width: 28px; height: 28px; border-radius: 14px; background: #ff6b81;
         display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; }
#footer { position: absolute; left: 232px; top: 204px; width: 152px; height: 80px; background: #394357; border-radius: 8px; }
#footer-dot { position: absolute; left: 64px; top: 28px; width: 24px; height: 24px; border-radius: 12px; background: #5ac4ff; }
</style>
</head>
<body>
  <div id="stage" data-name="Stage">
    <div class="pin" id="tl"></div>
    <div class="pin" id="tr"></div>
    <div class="pin" id="bl"></div>
    <div class="pin" id="br"></div>
    <div class="pin" id="mid"></div>
    <div class="pin" id="tilt"></div>
    <div id="stage-label">Canvas</div>
  </div>
  <div id="card" data-name="Card">
    <div class="line" id="l1"></div>
    <div class="line" id="l2"></div>
    <div class="line" id="l3"></div>
    <div class="line" id="l4"></div>
    <div id="badge">3</div>
  </div>
  <div id="footer"><div id="footer-dot"></div></div>
</body>
</html>
