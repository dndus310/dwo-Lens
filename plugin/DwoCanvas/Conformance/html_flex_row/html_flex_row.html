<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="dwocanvas:viewport" content="400x300">
<meta name="dwocanvas:name" content="HtmlFlexRow">
<title>Flex row: gap, padding, alignment</title>
<style>
/* Unreal's own Roboto files, so the browser and UE rasterize the same font */
@font-face { font-family: "Roboto"; font-weight: 400; font-style: normal; src: url("file:///C:/Program%20Files/Epic%20Games/UE_5.7/Engine/Content/Slate/Fonts/Roboto-Regular.ttf"); }
@font-face { font-family: "Roboto"; font-weight: 700; font-style: normal; src: url("file:///C:/Program%20Files/Epic%20Games/UE_5.7/Engine/Content/Slate/Fonts/Roboto-Bold.ttf"); }

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { background: #1f2430; font-family: "Roboto"; color: #f2f3f5; font-size: 13px; line-height: 15px; }
.row { position: absolute; left: 16px; width: 368px; display: flex; flex-direction: row; background: #2b3240; border-radius: 8px; }
.box { border-radius: 4px; flex: none; }
.a { background: #5ac4ff; }
.b { background: #ffb44a; }
.c { background: #8be08a; }
.label { font-weight: 700; }

/* 1: gap + padding, centred cross axis, hugging label */
#row1 { top: 16px; gap: 12px; padding: 12px 16px; align-items: center; }
#row1 .a { width: 40px; height: 40px; }
#row1 .b { width: 24px; height: 56px; }
#row1 .c { width: 64px; height: 24px; }

/* 2: centred main axis, items aligned to the end */
#row2 { top: 112px; height: 72px; padding: 8px; gap: 8px; justify-content: center; align-items: flex-end; box-sizing: border-box; }
#row2 .a { width: 48px; height: 32px; }
#row2 .b { width: 48px; height: 48px; }
#row2 .c { width: 48px; height: 20px; }

/* 3: stretch (no cross size) + a growing child, end-aligned main axis inside it */
#row3 { top: 200px; height: 84px; padding: 10px; gap: 10px; align-items: stretch; box-sizing: border-box; }
#row3 .a { width: 56px; }
#row3 .grow { flex: 1 1 0; background: #3d4658; border-radius: 4px; display: flex; justify-content: flex-end; align-items: center; padding: 0 12px; gap: 6px; }
#row3 .dot { width: 12px; height: 12px; border-radius: 6px; background: #ff6b81; flex: none; }
#row3 .c { width: 40px; }
</style>
</head>
<body>
  <div class="row" id="row1" data-name="Row1">
    <div class="box a" id="r1a"></div>
    <div class="box b" id="r1b"></div>
    <div class="box c" id="r1c"></div>
    <span class="label" id="r1label">Gap 12 / pad 16</span>
  </div>
  <div class="row" id="row2" data-name="Row2">
    <div class="box a" id="r2a"></div>
    <div class="box b" id="r2b"></div>
    <div class="box c" id="r2c"></div>
  </div>
  <div class="row" id="row3" data-name="Row3">
    <div class="box a" id="r3a"></div>
    <div class="grow" id="r3grow"><span class="label" id="r3label">Fill</span><div class="dot" id="r3dot1"></div><div class="dot" id="r3dot2"></div></div>
    <div class="box c" id="r3c"></div>
  </div>
</body>
</html>
