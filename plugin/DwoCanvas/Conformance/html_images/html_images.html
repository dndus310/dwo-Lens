<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="dwocanvas:viewport" content="400x300">
<meta name="dwocanvas:name" content="HtmlImages">
<title>Images: cover, contain, tile</title>
<style>
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { background: #262c38; }
/* photo.png is 64 x 48 (4:3), tile.png is 16 x 16: both generated by canvas/adapters/html/build_conformance.py */
.frame { position: absolute; top: 20px; width: 112px; height: 112px; }
#cover { left: 20px; object-fit: cover; }
#contain { left: 144px; object-fit: contain; }
#plain { left: 268px; width: 112px; height: 84px; }
#tiled { position: absolute; left: 20px; top: 156px; width: 248px; height: 124px; background-image: url("tile.png"); background-repeat: repeat; }
#bgcover { position: absolute; left: 288px; top: 156px; width: 92px; height: 124px; background: url("photo.png") center / cover no-repeat; }
</style>
</head>
<body>
  <img class="frame" id="cover" src="photo.png" alt="">
  <img class="frame" id="contain" src="photo.png" alt="">
  <img class="frame" id="plain" src="photo.png" alt="">
  <div id="tiled"></div>
  <div id="bgcover"></div>
</body>
</html>
