; Saved assets keep working after the plugin renames:
;   StateMonitor (dwo-Lens 1.x)  -> DwoStateMonitor (dwo-Forge 2.x)
;   OWTStateMonitor (older)      -> DwoStateMonitor
; A plugin's Config/Engine.ini is merged into the Engine config branch when the plugin is mounted (before
; UObject init reads [CoreRedirects]), so no code registration is needed. Class names did not change.
; BuildPlugin does not package Config/*.ini; dwo-Forge copies this file into the installed plugin.
[CoreRedirects]
+PackageRedirects=(OldName="/Script/StateMonitor",NewName="/Script/DwoStateMonitor")
+PackageRedirects=(OldName="/Script/OWTStateMonitor",NewName="/Script/DwoStateMonitor")
+ClassRedirects=(OldName="/Script/OWTStateMonitor.OWTStateMonitorWidget",NewName="/Script/DwoStateMonitor.StateMonitorWidget")
